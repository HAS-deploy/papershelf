name: PaperShelf
options:
  createIntermediateGroups: true
  bundleIdPrefix: com.papershelf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "NH2XFPC9KN"
    CODE_SIGN_STYLE: Automatic

targets:
  PaperShelf:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PaperShelf
        excludes:
          - "**/.DS_Store"
          - "**/Resources/**"
    resources:
      - path: PaperShelf/Resources/Assets.xcassets
      - path: PaperShelf/Resources/PrivacyInfo.xcprivacy
      - path: PaperShelf/Resources/Configuration.storekit
    info:
      path: PaperShelf/Resources/Info.plist
      properties:
        CFBundleDisplayName: PaperShelf
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "PaperShelf needs the camera to scan documents."
        NSPhotoLibraryUsageDescription: "PaperShelf can import document photos from your library."
        NSFaceIDUsageDescription: "PaperShelf can lock the archive behind Face ID."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papershelf.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  PaperShelfTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PaperShelfTests
    resources:
      - path: PaperShelfTests/Corpus
        type: folder
    dependencies:
      - target: PaperShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papershelf.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  # Scheme filename must match folder basename on case-insensitive APFS
  # (cannot ship both PaperShelf.xcscheme and papershelf.xcscheme).
  # Target + display name remain PaperShelf.
  papershelf:
    build:
      targets:
        PaperShelf: all
        PaperShelfTests: [test]
    run:
      config: Debug
      storeKitConfiguration: PaperShelf/Resources/Configuration.storekit
    test:
      config: Debug
      targets:
        - PaperShelfTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
